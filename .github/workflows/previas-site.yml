name: Prévias do Drive para o site

on:
  schedule:
    # 06:00 UTC = 3h em Brasília, todo dia
    # 11/11/2026: enquanto a cópia inicial (89 mil fotos) não termina, roda a cada 6 horas (uma rodada por vez);
    # depois de copiado tudo, cada rodada só lista o Drive e copia as novas
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Só mostrar quantas fotos copiaria (não copia nada)"
        type: boolean
        default: true
      limite:
        description: "Máximo de fotos nesta vez"
        default: "40000"

concurrency:
  group: previas-site
  cancel-in-progress: false

jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: Copiar as prévias novas para o site
        working-directory: scripts
        run: node espelhar-previas.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          JUNTAS: "10"
          SIMULAR: ${{ github.event_name == 'workflow_dispatch' && inputs.simular || 'false' }}
          LIMITE: ${{ inputs.limite || '40000' }}

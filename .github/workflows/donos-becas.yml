name: Donos das becas

# Roda só quando alguém manda (Actions → Donos das becas → Run workflow).
# Deixe "simular" marcado para ver antes o que vai mudar.
on:
  workflow_dispatch:
    inputs:
      simular:
        description: "Só mostrar o que mudaria (não grava)"
        type: boolean
        default: true
      sem_contrato:
        description: "E-mail de quem fica com os alunos de colégio sem contrato (vazio = a equipe toda vê)"
        default: ""

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: Donos das becas
        working-directory: scripts
        run: node donos-becas.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SIMULAR: ${{ inputs.simular }}
          SEM_CONTRATO: ${{ inputs.sem_contrato }}

name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regras de negócio, cálculo e arquivos do app
        run: node --test tests/*.test.mjs

  regras-firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar
        working-directory: tests/firebase
        run: npm install --no-audit --no-fund
      - name: Regras do Firebase no emulador
        working-directory: tests/firebase
        run: |
          set -o pipefail
          npx firebase emulators:exec --only firestore --project z7-teste "node --test --test-reporter=tap regras.test.mjs" 2>&1 | tee saida.txt || {
            grep -E "^not ok|error:|expected|actual|code:|message:" saida.txt | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            tail -25 saida.txt | tr '\n' ' ' | sed 's/^/::error title=final::/'
            exit 1; }

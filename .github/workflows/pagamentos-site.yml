name: Pagamentos do site (aluno vira Pago sozinho)

on:
  schedule:
    # a cada 10 minutos: o aluno vira Pago mesmo com o app fechado
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: pagamentos-site
  cancel-in-progress: false

jobs:
  pagamentos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: Registrar os pagamentos
        working-directory: scripts
        run: node pagamentos-site.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: ${{ vars.APP_URL }}

name: Cora · testar a API

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diagnóstico com curl no teste e na produção (só pede o token; não emite nada, sem mostrar o token)
        working-directory: scripts
        run: |
          umask 077
          printf '%s\n' "$CORA_CERT" > /tmp/c.pem
          printf '%s\n' "$CORA_KEY" > /tmp/k.key
          ID=$(printf '%s' "$CORA_CLIENT_ID" | grep -o 'int-[A-Za-z0-9]*' | head -1)
          openssl x509 -noout -modulus -in /tmp/c.pem | md5sum | cut -c1-8 | sed 's/^/cert /'
          openssl rsa -noout -modulus -in /tmp/k.key 2>/dev/null | md5sum | cut -c1-8 | sed 's/^/key  /'
          for H in matls-clients.api.stage.cora.com.br matls-clients.api.cora.com.br; do
            printf '%s: ' "$H"
            curl -s -o /tmp/r.json -w "HTTP %{http_code} · " --cert /tmp/c.pem --key /tmp/k.key -H 'Content-Type: application/x-www-form-urlencoded' -X POST https://$H/token -d "grant_type=client_credentials&client_id=$ID" || true
            node -e "const j=require('/tmp/r.json'); console.log(j.access_token ? 'token OK' : JSON.stringify(j))" || true
          done
          rm -f /tmp/c.pem /tmp/k.key /tmp/r.json
        env:
          CORA_CLIENT_ID: ${{ secrets.CORA_CLIENT_ID }}
          CORA_CERT: ${{ secrets.CORA_CERT }}
          CORA_KEY: ${{ secrets.CORA_KEY }}
      - name: Testar a API da Cora (ambiente de teste)
        working-directory: scripts
        run: node cora-teste.mjs
        env:
          CORA_AMBIENTE: stage
          CORA_CLIENT_ID: ${{ secrets.CORA_CLIENT_ID }}
          CORA_CERT: ${{ secrets.CORA_CERT }}
          CORA_KEY: ${{ secrets.CORA_KEY }}

name: Juntar Paspatur no PR

# Roda só quando alguém manda (Actions → Juntar Paspatur no PR → Run workflow).
# Deixe "simular" marcado para ver antes o que vai mudar. A cópia de segurança fica no banco (coleção copiaPaspatur).
on:
  workflow_dispatch:
    inputs:
      simular:
        description: "Só mostrar o que mudaria (não grava)"
        type: boolean
        default: true

jobs:
  juntar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: Juntar
        working-directory: scripts
        run: node juntar-paspatur.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SIMULAR: ${{ inputs.simular }}

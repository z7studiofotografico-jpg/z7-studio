name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regras de negócio, cálculo e arquivos do app
        run: node --test tests/*.test.mjs
      - name: Código do site (formulário do site → Funil)
        run: php tests/site-funil.php

  estilo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Formatação (Prettier) e erros comuns (ESLint)
        run: |
          npx --yes prettier@3.3.3 --check "js/*.js" "scripts/*.mjs" sw.js
          npx --yes eslint@8.57.0 --no-eslintrc -c .eslintrc.json --max-warnings 0 "js/*.js"

  app-no-navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar
        working-directory: tests/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Abrir o app num navegador e usar como o Adriano e o vendedor
        run: |
          node tests/e2e/app.e2e.mjs > saida.txt 2>&1 && { cat saida.txt; exit 0; }
          cat saida.txt
          grep -E "✗|Error|Erros" saida.txt | head -10 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
          exit 1

  regras-firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar
        working-directory: tests/firebase
        run: npm install --no-audit --no-fund
      - name: Regras do Firebase no emulador
        working-directory: tests/firebase
        run: |
          cp ../../firestore.rules regras-copia.rules
          npx firebase emulators:exec --only firestore --project z7-teste "node --test --test-reporter=tap regras.test.mjs" > saida.txt 2>&1 && exit 0
          grep -E "^\s*not ok|^\s*(error|code|failureType|location):" saida.txt | head -10 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
          grep -B2 -A14 "^\s*not ok" saida.txt | grep -vE "^\s*$" | head -10 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::warning::$l"; done
          exit 1
